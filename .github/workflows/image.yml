name: Container image

# Publishes the release image to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :latest, for linux/amd64 and linux/arm64.
#
# - Only a vX.Y.Z tag publishes (workflow_dispatch rebuilds one existing tag by hand).
#   Pushes to main are built and scanned by ci.yml and never leave the runner.
# - The image is scanned with Trivy *before* it is pushed; a fixable HIGH/CRITICAL
#   finding stops the job and nothing is published.
# - Every pushed image carries a signed SLSA build provenance attestation (Sigstore,
#   keyless) and an SBOM, so anyone can check it was built here, from that tag:
#     gh attestation verify oci://ghcr.io/<owner>/<repo>:X.Y.Z --owner <owner>
#
# The runner's GITHUB_TOKEN is the only credential. A package created this way starts
# out private: make it public once under the package's settings, or anonymous
# `docker pull` answers "denied".

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and publish (e.g. v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # Sigstore signing certificate for the attestation
      attestations: write  # store the attestation next to the repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The tag drives every name, also under workflow_dispatch, where github.ref is main.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
          flavor: |
            latest=auto

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Scan first: build the amd64 variant into the local daemon and let Trivy fail
      # the job. The multi-arch push below reuses the cached layers.
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: scan:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
