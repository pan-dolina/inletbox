name: Release

# GitHub Releases whose notes come from CHANGELOG.md, kept in step with it.
#
# - Pushing a vX.Y.Z tag publishes its release. A tag without a changelog section fails
#   the job rather than publishing an empty release.
# - Pushing to main a change to CHANGELOG.md (or to how notes are built) rewrites the
#   notes of every release that already exists, so correcting the changelog corrects
#   the published releases — nobody has to remember to re-run anything.
# - workflow_dispatch does the same for one tag by hand.
#
# Notes are NOT auto-generated. `--generate-notes` builds its list from merged pull
# requests, and this repository commits straight to main, so it produced release bodies
# containing nothing but a compare link.
#
# Nothing here needs a personal token: the runner's GITHUB_TOKEN is enough, which is the
# point — releases should not depend on what is installed on someone's laptop. The notes
# themselves are built by .github/scripts/release-notes.sh, which also runs locally.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    branches: [main]
    # Path filters only apply to the branch push; a tag push always runs.
    paths:
      - CHANGELOG.md
      - .github/workflows/release.yml
      - .github/scripts/release-notes.sh
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release or re-sync (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the GitHub Release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating or editing a release writes to the repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag is needed for the compare link

      - name: Publish (create, or re-sync an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! .github/scripts/release-notes.sh "${TAG}" > notes.md; then
            echo "::error::no notes for ${TAG} — add its section to CHANGELOG.md before tagging"
            exit 1
          fi
          echo "--- notes for ${TAG} ---"
          cat notes.md
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md --verify-tag
          fi

  sync:
    name: Re-sync published release notes
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rewrite every release whose section changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only releases that already exist are touched; creating one stays the job of
          # a tag push, so a changelog section written ahead of tagging publishes nothing.
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            if ! .github/scripts/release-notes.sh "${tag}" > notes.md; then
              echo "::warning::${tag} has a release but no CHANGELOG.md section; left as it is"
              continue
            fi
            if [ "$(gh release view "${tag}" --json body --jq .body)" = "$(cat notes.md)" ]; then
              echo "${tag}: up to date"
            else
              gh release edit "${tag}" --notes-file notes.md
              echo "${tag}: notes rewritten from CHANGELOG.md"
            fi
          done
