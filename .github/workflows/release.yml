name: Release

# Turns a pushed vX.Y.Z tag into a GitHub Release whose notes come from CHANGELOG.md.
#
# Notes are NOT auto-generated. `--generate-notes` builds its list from merged pull
# requests, and this repository commits straight to main, so it produced a release body
# containing nothing but a compare link. CHANGELOG.md is the source of truth instead, and
# a tag without a section there fails the job rather than publishing an empty release.
#
# Nothing here needs a personal token: the runner's GITHUB_TOKEN is enough, which is the
# point — releases should not depend on what is installed on someone's laptop.
#
# workflow_dispatch takes a tag name, to backfill older tags or to re-sync a release body
# after CHANGELOG.md is corrected.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release or re-sync (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating or editing a release writes to the repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag is needed for the compare link

      - name: Build the notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} does not exist"
            exit 1
          fi

          # The section runs from "## [x.y.z]" to the next section or to the link
          # definitions at the bottom of the file.
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found && /^\[[^]]+\]: / { exit }
            found                  { print }
          ' CHANGELOG.md > notes.md

          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v} — add one before tagging"
            exit 1
          fi

          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "${PREV}" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${PREV}" "${TAG}" >> notes.md
          fi

          echo "--- notes for ${TAG} ---"
          cat notes.md

      - name: Publish (create, or re-sync an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} exists, re-syncing its notes from CHANGELOG.md"
            gh release edit "${TAG}" --title "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md --verify-tag
          fi
