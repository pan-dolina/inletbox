name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, stop and use
        [private vulnerability reporting](https://github.com/pan-dolina/inletbox/security/advisories/new)
        instead. Never paste an upload-link token, an admin password or a `.env` into a
        public issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the page footer, e.g. v0.2.0.
      placeholder: v0.2.0
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [local disk, S3 / MinIO]
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options: [Docker Compose, Docker, npm start, npm run dev]
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A file size or a file name often matters.
      placeholder: |
        1. Create a case and a link with …
        2. Upload a 2 GB file from the browser
        3. The progress bar …
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, status codes, browser console
      description: >
        Redact tokens. Server logs already replace them with [redacted]; the browser
        network tab does not.
      render: shell

  - type: checkboxes
    id: proxy
    attributes:
      label: Environment
      options:
        - label: It runs behind a reverse proxy or load balancer
        - label: TRUST_PROXY is set
        - label: TLS is terminated somewhere in front of the app
