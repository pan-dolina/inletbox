services:
  app:
    # The released image from GitHub Container Registry. Pin the version in .env
    # (INLETBOX_VERSION=0.6.2); `latest` is the newest release. `docker compose up -d` pulls
    # it; `docker compose up -d --build` builds this checkout instead, under the
    # same name.
    image: ghcr.io/pan-dolina/inletbox:${INLETBOX_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - inletbox-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Optional: MinIO for testing the S3 backend.
  #   docker compose --profile minio up -d
  # Then set in .env: STORAGE_BACKEND=s3, S3_ENDPOINT=http://minio:9000,
  # S3_BUCKET=inletbox, S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY as below,
  # S3_FORCE_PATH_STYLE=true. Change the credentials before exposing MinIO.
  #
  # The image is Chainguard's build of MinIO: MinIO no longer publishes images
  # that can be pulled anonymously (quay.io/minio/* answers 401 since 2026-09).
  # It carries both `minio` and `mc`, so it also serves as the one-shot init.
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${S3_BUCKET:-inletbox} &&
        mc anonymous set none local/${S3_BUCKET:-inletbox} &&
        echo 'bucket ready (private)'
      "

volumes:
  inletbox-data:
  minio-data:
